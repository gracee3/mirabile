[package]
name = "astra-web"
description = "Leptos CSR presentation adapter for Astra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
browser-contract = ["dep:astra-core", "dep:astra-store", "astra-store/browser-contract"]

[dependencies]
astra-app.workspace = true
astra-core = { path = "../../crates/astra-core", optional = true }
astra-store = { path = "../../crates/astra-store", optional = true }
async-trait.workspace = true
leptos.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "HtmlInputElement", "Window"] }

[dev-dependencies]
futures.workspace = true

[lints]
workspace = true
