[package]
name = "mirabile-web"
description = "Leptos CSR presentation adapter for Mirabile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["xalen-backend"]
browser-contract = ["dep:mirabile-core", "dep:mirabile-store", "mirabile-store/browser-contract"]
xalen-backend = ["mirabile-app/xalen-backend", "mirabile-engine/xalen-backend"]

[dependencies]
mirabile-app.workspace = true
mirabile-core = { path = "../../crates/mirabile-core", optional = true }
mirabile-engine = { path = "../../crates/mirabile-engine" }
mirabile-store = { path = "../../crates/mirabile-store", optional = true }
async-trait.workspace = true
js-sys.workspace = true
leptos.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "DedicatedWorkerGlobalScope",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "MessageEvent",
    "Window",
    "console",
] }

[dev-dependencies]
futures.workspace = true
mirabile-store = { path = "../../crates/mirabile-store" }

[lints]
workspace = true
